<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Idiom Academy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a3a5c 0%, #2d6da8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }
        .tagline {
            font-size: 1.1rem;
            opacity: 0.85;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .badge {
            display: inline-block;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            padding: 0.8rem 1.5rem;
            margin-top: 1rem;
        }
        .badge a {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }
        .features {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .feature {
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 1rem;
            width: 160px;
        }
        .feature-icon { font-size: 1.5rem; margin-bottom: 0.4rem; }
        .feature-text { font-size: 0.85rem; opacity: 0.9; }
        footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            opacity: 0.6;
        }
        footer a { color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📚</div>
        <h1>English Idiom Academy</h1>
        <p class="tagline">Master 1,275+ English idioms with daily lessons, spaced repetition, and quizzes. Available in 9 languages.</p>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">🎯</div>
                <div class="feature-text">Daily Idiom</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🧠</div>
                <div class="feature-text">Spaced Repetition</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📝</div>
                <div class="feature-text">Quiz Mode</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🌍</div>
                <div class="feature-text">9 Languages</div>
            </div>
        </div>

        <div class="badge">
            <a href="https://play.google.com/store/apps/details?id=com.idiomlearningapp" target="_blank">
                Get it on Google Play
            </a>
        </div>

        <footer>
            <p>&copy; 2025 English Idiom Academy</p>
            <p><a href="privacy.html">Privacy Policy</a></p>
        </footer>
    </div>
</body>
</html>
